<svg width="420" height="100" viewBox="0 0 420 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient -->
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff"></stop>
      <stop offset="50%" stop-color="#7c4dff"></stop>
      <stop offset="100%" stop-color="#ff4fd8"></stop>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>

  <!-- ICON -->
  <g transform="translate(10,20)" filter="url(#glow)">
    <!-- Circle -->
    <circle cx="30" cy="30" r="26" stroke="url(#grad)" stroke-width="3" fill="none"></circle>
    
    <!-- AI lines -->
    <path d="M30 10 L30 50 M10 30 L50 30" stroke="url(#grad)" stroke-width="2"></path>
    
    <!-- Nodes -->
    <circle cx="30" cy="10" r="3" fill="#00e5ff"></circle>
    <circle cx="10" cy="30" r="3" fill="#7c4dff"></circle>
    <circle cx="50" cy="30" r="3" fill="#ff4fd8"></circle>
    <circle cx="30" cy="50" r="3" fill="#00e5ff"></circle>
  </g>

  <!-- TEXT -->
  <text x="80" y="60" font-size="38" font-family="Poppins, Arial, sans-serif" font-weight="600" fill="url(#grad)" filter="url(#glow)">
    AI Content Studio
  </text>
</svg>